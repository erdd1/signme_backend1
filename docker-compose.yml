version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: eecsigncard_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eecsigncard
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - eecsigncard

  redis:
    image: redis:7-alpine
    container_name: eecsigncard_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eecsigncard

volumes:
  mysql_data:
  redis_data:

networks:
  eecsigncard:
    driver: bridge
