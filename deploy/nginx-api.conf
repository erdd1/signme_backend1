server {
    listen 80;
    listen [::]:80;
    server_name api.signmecy.org;

    root /var/www/signmecy-api/public;
    index index.php;

    client_max_body_size 32M;

    access_log /var/log/nginx/signmecy-api-access.log;
    error_log /var/log/nginx/signmecy-api-error.log;

    # Images (stockage local, remplace Cloudinary) : servies directement par
    # nginx sans jamais passer par PHP-FPM. Le nom de fichier inclut déjà un
    # identifiant unique par upload (uuid/timestamp — voir ImageStorageService),
    # donc un fichier existant ne change jamais de contenu : cache longue durée
    # sans revalidation ("immutable") sans risque de servir une image périmée.
    location ~* ^/storage/.*\.(jpg|jpeg|png|webp|gif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Laravel Reverb (WebSocket) — proxy vers le serveur reverb:start local (port 8080)
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
