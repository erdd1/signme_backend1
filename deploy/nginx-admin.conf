server {
    listen 80;
    listen [::]:80;
    server_name admin.signmecy.org;

    root /var/www/signmecy-admin;
    index index.html;

    access_log /var/log/nginx/signmecy-admin-access.log;
    error_log /var/log/nginx/signmecy-admin-error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
